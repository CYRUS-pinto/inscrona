[project]
name = "inscrona"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mobile"]
